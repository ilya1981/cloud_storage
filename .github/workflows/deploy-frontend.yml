name: Deploy Full Stack to Server

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Фронтенд (Vite 8.1.2) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend via rsync
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519_gha
          chmod 600 ~/.ssh/id_ed25519_gha

          echo "StrictHostKeyChecking no" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

          # Без --delete и без сохранения времени — стабильно для Nginx
          rsync -avz --omit-dir-times -e "ssh -i ~/.ssh/id_ed25519_gha" \
            ./frontend/dist/ \
            ilya@${{ secrets.SERVER_IP }}:/home/ilya/cloud_storage/frontend/dist

      # --- Бэкенд (Django 5.2.1 + Gunicorn) ---
      - name: Apply Django migrations
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519_gha
          chmod 600 ~/.ssh/id_ed25519_gha

          echo "StrictHostKeyChecking no" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

          ssh -i ~/.ssh/id_ed25519_gha ilya@${{ secrets.SERVER_IP }} \
            "cd /home/ilya/cloud_storage && source env/bin/activate && python manage.py migrate --noinput"

      - name: Restart Gunicorn
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519_gha
          chmod 600 ~/.ssh/id_ed25519_gha

          echo "StrictHostKeyChecking no" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

          # Перезапуск через systemctl — самый надёжный способ
          ssh -i ~/.ssh/id_ed25519_gha ilya@${{ secrets.SERVER_IP }} \
            "sudo systemctl restart gunicorn-cloud_storage"


