name: Deploy Frontend to Server

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Deploy via rsync (with base64 SSH key)
        run: |
          # Создаём директорию для SSH и ставим строгие права
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Декодируем приватный ключ из base64 и пишем в файл
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519_gha
          chmod 600 ~/.ssh/id_ed25519_gha

          # Отключаем проверку хоста (чтобы не было интерактивного запроса)
          echo "StrictHostKeyChecking no" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

          # Деплоим собранный фронтенд через rsync
          rsync -avz --delete -e "ssh -i ~/.ssh/id_ed25519_gha" \
            ./frontend/dist/ \
            ilya@${{ secrets.SERVER_IP }}:/home/ilya/cloud_storage/frontend/dist
