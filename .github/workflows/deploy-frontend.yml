name: Deploy Full Stack (Frontend + Migrations + Backend)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Фронтенд (Vite 8.1.2) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Install and build frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Deploy frontend via rsync
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519_gha
          chmod 600 ~/.ssh/id_ed25519_gha

          echo "StrictHostKeyChecking no" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

          # --omit-dir-times убирает ошибки "Operation not permitted"
          rsync -avz --omit-dir-times -e "ssh -i ~/.ssh/id_ed25519_gha" \
            ./frontend/dist/ \
            ilya@${{ secrets.SERVER_IP }}:/home/ilya/cloud_storage/frontend/dist

      # --- Миграции Django (тем же Python, что и Gunicorn) ---
      - name: Apply Django migrations
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519_gha
          chmod 600 ~/.ssh/id_ed25519_gha

          echo "StrictHostKeyChecking no" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

          ssh -i ~/.ssh/id_ed25519_gha ilya@${{ secrets.SERVER_IP }} \
            "cd /home/ilya/cloud_storage && /home/ilya/cloud_storage/env/bin/python manage.py migrate --noinput"

      # --- Рестарт бэкенда (через systemd) ---
      - name: Restart backend service
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519_gha
          chmod 600 ~/.ssh/id_ed25519_gha

          echo "StrictHostKeyChecking no" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

          ssh -i ~/.ssh/id_ed25519_gha ilya@${{ secrets.SERVER_IP }} \
            "sudo systemctl restart cloud_storage"



      - name: Health check API
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519_gha
          chmod 600 ~/.ssh/id_ed25519_gha

          echo "StrictHostKeyChecking no" > ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config

          # Проверяем, что API жив
          ssh -i ~/.ssh/id_ed25519_gha ilya@${{ secrets.SERVER_IP }} \
            "curl -f -v -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/api/" || exit 1

        

